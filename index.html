<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Mapa sklepów</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --accent: #c9202f;
      --accent-dark: #9f1623;
      --text: #1f1f1f;
      --muted: #6b7280;
      --border: #e5e7eb;
      --panel: #ffffff;
      --soft: #f7f7f7;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      color: var(--text);
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .locator-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 360px;
      max-width: calc(100% - 32px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    .locator-search {
      padding: 12px;
      background: var(--panel);
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201, 32, 47, 0.14);
    }

    #clearSearch {
      min-width: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--text);
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
    }

    #resultsCount {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .radius-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    #storeList {
      display: none;
      max-height: 320px;
      overflow: auto;
      border-top: 1px solid var(--border);
      background: var(--soft);
    }

    #storeList.is-visible {
      display: block;
    }

    .store-item {
      width: 100%;
      display: block;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .store-item:hover {
      background: #fafafa;
    }

    .store-name {
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 700;
    }

    .store-address {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .store-distance {
      margin-top: 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .info-window {
      max-width: 270px;
      padding: 4px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
    }

    .info-title {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .info-row {
      margin-bottom: 6px;
    }

    .info-label {
      font-weight: 700;
      color: var(--muted);
    }

    .info-phone {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .directions-button {
      display: inline-block;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .directions-button:hover {
      background: var(--accent-dark);
    }

    @media (max-width: 700px) {
      .locator-panel {
        top: 10px;
        right: 10px;
        width: calc(100% - 20px);
      }

      #storeList {
        max-height: 260px;
      }
    }
  </style>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyfQemGqfFMURA4AkQF1LtRCVDK2OGd_Y"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
</head>
<body>
  <div class="locator-panel">
    <div class="locator-search">
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Wpisz miejscowość..." />
        <button id="clearSearch" type="button" aria-label="Wyczyść">×</button>
      </div>
      <div id="resultsCount">Ładowanie sklepów...</div>
      <div id="radiusNote" class="radius-note"></div>
    </div>

    <div id="storeList"></div>
  </div>

  <div id="map"></div>

  <script>
    const NEARBY_RADIUS_KM = 30;

    const mapStyles = [
      { featureType: "poi", stylers: [{ visibility: "off" }] },
      { featureType: "transit", stylers: [{ visibility: "off" }] },
      { featureType: "road", elementType: "labels.icon", stylers: [{ visibility: "off" }] },

      { featureType: "landscape", elementType: "geometry", stylers: [{ color: "#f4f4f4" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#d0d0d0" }] },

      { featureType: "road", elementType: "geometry", stylers: [{ color: "#b8b8b8" }] },
      { featureType: "road.local", elementType: "geometry", stylers: [{ color: "#c4c4c4" }] },
      { featureType: "road.arterial", elementType: "geometry", stylers: [{ color: "#9f9f9f" }] },
      { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#7f7f7f" }] },
      { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#5f5f5f" }] },

      { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#3f3f3f" }] },
      { featureType: "road", elementType: "labels.text.stroke", stylers: [{ color: "#ffffff" }] },

      { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#111111" }] },
      { featureType: "administrative.locality", elementType: "labels.text.stroke", stylers: [{ color: "#ffffff" }] }
    ];

    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 50.0, lng: 21.8 },
      zoom: 8,
      styles: mapStyles,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: true
    });

    const csvUrl = "https://raw.githubusercontent.com/mateuszslota1/mapa-sklepow/refs/heads/main/Lokalizacja_sklepow.csv";

    const geocoder = new google.maps.Geocoder();
    const infoWindow = new google.maps.InfoWindow();
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const resultsCount = document.getElementById("resultsCount");
    const radiusNote = document.getElementById("radiusNote");
    const storeList = document.getElementById("storeList");

    const stores = [];
    let clusterer = null;
    let mapFinished = false;

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      delimiter: ",",
      skipEmptyLines: true,

      complete: function (results) {
        let pendingGeocodes = 0;

        results.data.forEach((row) => {
          const name = row["Nazwa"]?.trim();
          const address = row["Adres"]?.trim();
          const city = row["Miasto"]?.trim();
          const phone = row["Telefon kontaktowy (jeśli mamy, jeśli nie mamy to puste)"]?.trim();

          const lat = parseCoordinate(row["szerokość geograficzna (latitude)"]);
          const lng = parseCoordinate(row["długość geograficzna (longitude)"]);

          if (!name || !address || !city) return;

          const fullAddress = `${address}, ${city}`;

          if (!isNaN(lat) && !isNaN(lng)) {
            createStore({ lat, lng }, name, address, city, fullAddress, phone);
          } else {
            pendingGeocodes++;

            geocoder.geocode({ address: fullAddress }, (results, status) => {
              pendingGeocodes--;

              if (status === "OK" && results[0]) {
                createStore(results[0].geometry.location, name, address, city, fullAddress, phone);
              } else {
                console.warn(`Nie znaleziono adresu: ${fullAddress}`);
              }

              if (pendingGeocodes === 0) finishMap();
            });
          }
        });

        if (pendingGeocodes === 0) finishMap();
      },

      error: function () {
        resultsCount.textContent = "Nie udało się wczytać sklepów.";
      }
    });

    searchInput.addEventListener("input", () => {
      filterStores(searchInput.value);
    });

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      filterStores("");
      searchInput.focus();
    });

    function createStore(location, name, address, city, fullAddress, phone) {
      const marker = new google.maps.Marker({
        position: location,
        title: name,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: "#c9202f",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 3
        }
      });

      const store = {
        name,
        address,
        city,
        fullAddress,
        phone,
        marker,
        searchText: normalizeText(`${name} ${address} ${city} ${phone || ""}`),
        cityText: normalizeText(city),
        distanceFromSearch: null
      };

      marker.addListener("click", () => openStore(store));

      stores.push(store);
    }

    function finishMap() {
      if (mapFinished) return;

      mapFinished = true;

      clusterer = new markerClusterer.MarkerClusterer({
        map,
        markers: stores.map((store) => store.marker),
        renderer: createClusterRenderer()
      });

      resultsCount.textContent = `Dostępnych sklepów: ${stores.length}`;
      radiusNote.textContent = "Wpisz miejscowość, aby zobaczyć listę najbliższych sklepów.";
      fitMapToStores(stores);
    }

    function filterStores(query) {
      if (!mapFinished) return;

      const normalizedQuery = normalizeText(query);

      stores.forEach((store) => {
        store.distanceFromSearch = null;
      });

      if (!normalizedQuery) {
        storeList.classList.remove("is-visible");
        storeList.innerHTML = "";
        radiusNote.textContent = "Wpisz miejscowość, aby zobaczyć listę najbliższych sklepów.";
        updateVisibleStores(stores, null, false);
        return;
      }

      const exactCityStores = stores.filter((store) => store.cityText === normalizedQuery);
      const partialCityStores = stores.filter((store) => store.cityText.includes(normalizedQuery));

      if (exactCityStores.length > 0) {
        const center = getStoresCenter(exactCityStores);
        const nearbyStores = getStoresWithinRadius(center, NEARBY_RADIUS_KM);

        nearbyStores.forEach((store) => {
          if (store.cityText !== normalizedQuery) {
            store.distanceFromSearch = getDistanceKm(center, store.marker.getPosition());
          }
        });

        nearbyStores.sort((a, b) => {
          const distanceA = a.distanceFromSearch ?? 0;
          const distanceB = b.distanceFromSearch ?? 0;
          return distanceA - distanceB;
        });

        radiusNote.textContent = `Pokazuję sklepy w promieniu ${NEARBY_RADIUS_KM} km od miejscowości: ${query}`;
        updateVisibleStores(nearbyStores, center, true);
        return;
      }

      if (partialCityStores.length > 0) {
        radiusNote.textContent = "Doprecyzuj miejscowość, aby pokazać także sklepy z okolicy.";
        updateVisibleStores(partialCityStores, null, true);
        return;
      }

      const textMatches = stores.filter((store) => store.searchText.includes(normalizedQuery));
      radiusNote.textContent = "";
      updateVisibleStores(textMatches, null, true);
    }

    function updateVisibleStores(visibleStores, center, showList) {
      infoWindow.close();

      clusterer.clearMarkers();
      clusterer.addMarkers(visibleStores.map((store) => store.marker));

      renderStores(visibleStores, showList);
      updateResultsCount(visibleStores.length);
      fitMapToStores(visibleStores, center);
    }

    function renderStores(visibleStores, showList) {
      storeList.innerHTML = "";

      if (!showList) {
        storeList.classList.remove("is-visible");
        return;
      }

      storeList.classList.add("is-visible");

      if (visibleStores.length === 0) {
        storeList.innerHTML = `
          <div class="store-item">
            <div class="store-name">Brak wyników</div>
            <div class="store-address">Spróbuj wpisać inną miejscowość, nazwę sklepu albo ulicę.</div>
          </div>
        `;
        return;
      }

      visibleStores.forEach((store) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "store-item";

        const distanceHtml = typeof store.distanceFromSearch === "number"
          ? `<div class="store-distance">${store.distanceFromSearch.toFixed(1)} km od szukanej miejscowości</div>`
          : "";

        item.innerHTML = `
          <div class="store-name">${escapeHtml(store.name)}</div>
          <div class="store-address">${escapeHtml(store.address)}, ${escapeHtml(store.city)}</div>
          ${distanceHtml}
        `;

        item.addEventListener("click", () => {
          openStore(store);
          map.panTo(store.marker.getPosition());
          map.setZoom(14);
        });

        storeList.appendChild(item);
      });
    }

    function openStore(store) {
      infoWindow.setContent(createInfoWindowContent(store));
      infoWindow.open(map, store.marker);
    }

    function createInfoWindowContent(store) {
      const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(store.fullAddress)}`;

      const phoneHtml = store.phone
        ? `
          <div class="info-row">
            <span class="info-label">Telefon:</span>
            <a class="info-phone" href="tel:${cleanPhoneNumber(store.phone)}">${escapeHtml(store.phone)}</a>
          </div>
        `
        : "";

      return `
        <div class="info-window">
          <div class="info-title">${escapeHtml(store.name)}</div>
          <div class="info-row">
            <span class="info-label">Adres:</span>
            ${escapeHtml(store.fullAddress)}
          </div>
          ${phoneHtml}
          <a class="directions-button" href="${directionsUrl}" target="_blank" rel="noopener">
            Wyznacz trasę
          </a>
        </div>
      `;
    }

    function fitMapToStores(visibleStores, center) {
      if (visibleStores.length === 0) return;

      const bounds = new google.maps.LatLngBounds();

      visibleStores.forEach((store) => {
        bounds.extend(store.marker.getPosition());
      });

      if (center) bounds.extend(center);

      map.fitBounds(bounds);

      if (visibleStores.length === 1) {
        map.setZoom(14);
      }

      google.maps.event.addListenerOnce(map, "bounds_changed", () => {
        if (map.getZoom() > 12 && visibleStores.length > 1) {
          map.setZoom(12);
        }
      });
    }

    function getStoresCenter(centerStores) {
      const total = centerStores.reduce((sum, store) => {
        const position = store.marker.getPosition();

        return {
          lat: sum.lat + position.lat(),
          lng: sum.lng + position.lng()
        };
      }, { lat: 0, lng: 0 });

      return new google.maps.LatLng(
        total.lat / centerStores.length,
        total.lng / centerStores.length
      );
    }

    function getStoresWithinRadius(center, radiusKm) {
      return stores.filter((store) => {
        return getDistanceKm(center, store.marker.getPosition()) <= radiusKm;
      });
    }

    function getDistanceKm(pointA, pointB) {
      const earthRadiusKm = 6371;
      const lat1 = toRadians(pointA.lat());
      const lat2 = toRadians(pointB.lat());
      const deltaLat = toRadians(pointB.lat() - pointA.lat());
      const deltaLng = toRadians(pointB.lng() - pointA.lng());

      const a =
        Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
        Math.cos(lat1) * Math.cos(lat2) *
        Math.sin(deltaLng / 2) * Math.sin(deltaLng / 2);

      return earthRadiusKm * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateResultsCount(count) {
      if (count === 1) {
        resultsCount.textContent = "Znaleziono 1 sklep";
      } else {
        resultsCount.textContent = `Znaleziono ${count} sklepów`;
      }
    }

    function createClusterRenderer() {
      return {
        render: ({ count, position }) => {
          return new google.maps.Marker({
            position,
            label: {
              text: String(count),
              color: "#ffffff",
              fontSize: "13px",
              fontWeight: "700"
            },
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: Math.min(18 + count / 4, 34),
              fillColor: "#1f1f1f",
              fillOpacity: 0.94,
              strokeColor: "#c9202f",
              strokeWeight: 4
            },
            zIndex: Number(google.maps.Marker.MAX_ZINDEX) + count
          });
        }
      };
    }

    function parseCoordinate(value) {
      if (!value) return NaN;

      return parseFloat(
        String(value)
          .replace(/"/g, "")
          .replace(/,/g, "")
          .trim()
      );
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function cleanPhoneNumber(phone) {
      return String(phone).replace(/[^\d+]/g, "");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toRadians(value) {
      return value * Math.PI / 180;
    }
  </script>
</body>
</html>
