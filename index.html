<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Mapa sklepów</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .search-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 320px;
      max-width: calc(100% - 32px);
      padding: 12px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    #clearSearch {
      min-width: 40px;
      border: 0;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
      font-size: 22px;
      cursor: pointer;
    }

    #clearSearch:hover {
      background: #cbd5e1;
    }

    #resultsCount {
      margin-top: 8px;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
    }

    .info-window {
      max-width: 260px;
      padding: 4px;
      color: #1f2933;
      font-size: 14px;
      line-height: 1.4;
    }

    .info-title {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #173f35;
    }

    .info-row {
      margin-bottom: 6px;
    }

    .info-label {
      font-weight: 700;
      color: #52606d;
    }

    .info-phone {
      color: #0f766e;
      text-decoration: none;
      font-weight: 700;
    }

    .info-phone:hover {
      text-decoration: underline;
    }

    .directions-button {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #0f766e;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .directions-button:hover {
      background: #115e59;
    }

    @media (max-width: 600px) {
      .search-panel {
        top: 12px;
        left: 12px;
        width: calc(100% - 48px);
      }
    }
  </style>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyfQemGqfFMURA4AkQF1LtRCVDK2OGd_Y"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
</head>
<body>
  <div class="search-panel">
    <div class="search-row">
      <input
        id="searchInput"
        type="text"
        placeholder="Szukaj sklepu, miasta lub adresu..."
      />
      <button id="clearSearch" type="button" aria-label="Wyczyść wyszukiwanie">×</button>
    </div>
    <div id="resultsCount">Ładowanie sklepów...</div>
  </div>

  <div id="map"></div>

  <script>
    const mapStyles = [
      {
        featureType: "administrative",
        elementType: "geometry",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "poi",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "road",
        elementType: "labels.icon",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "transit",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "water",
        elementType: "geometry",
        stylers: [{ color: "#c9e7e5" }]
      },
      {
        featureType: "landscape",
        elementType: "geometry",
        stylers: [{ color: "#f3f6f2" }]
      },
      {
        featureType: "road",
        elementType: "geometry",
        stylers: [{ color: "#ffffff" }]
      },
      {
        featureType: "road.arterial",
        elementType: "geometry",
        stylers: [{ color: "#d9e4dd" }]
      },
      {
        featureType: "road.highway",
        elementType: "geometry",
        stylers: [{ color: "#b9d3c7" }]
      },
      {
        featureType: "road",
        elementType: "labels.text.fill",
        stylers: [{ color: "#64748b" }]
      },
      {
        featureType: "administrative.locality",
        elementType: "labels.text.fill",
        stylers: [{ color: "#334155" }]
      }
    ];

    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 50.0, lng: 21.8 },
      zoom: 8,
      styles: mapStyles,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: true
    });

    const csvUrl = "https://raw.githubusercontent.com/mateuszslota1/mapa-sklepow/refs/heads/main/Lokalizacja_sklepow.csv";

    const geocoder = new google.maps.Geocoder();
    const infoWindow = new google.maps.InfoWindow();
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const resultsCount = document.getElementById("resultsCount");

    const markers = [];
    let clusterer = null;
    let mapFinished = false;

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      delimiter: ";",
      skipEmptyLines: true,

      complete: function (results) {
        const data = results.data;
        let pendingGeocodes = 0;

        data.forEach((row) => {
          const name = row["Nazwa"]?.trim();
          const address = row["Adres"]?.trim();
          const city = row["Miasto"]?.trim();
          const phone = row['Telefon kontaktowy (jeśli mamy; jeśli nie mamy to puste)']?.trim();

          const lat = parseCoordinate(row["szerokość geograficzna (latitude)"]);
          const lng = parseCoordinate(row["długość geograficzna (longitude)"]);

          if (!name || !address || !city) {
            return;
          }

          const fullAddress = `${address}, ${city}`;

          if (!isNaN(lat) && !isNaN(lng)) {
            createMarker({ lat, lng }, name, fullAddress, phone, city);
          } else {
            pendingGeocodes++;

            geocoder.geocode({ address: fullAddress }, (results, status) => {
              pendingGeocodes--;

              if (status === "OK" && results[0]) {
                const location = results[0].geometry.location;
                createMarker(location, name, fullAddress, phone, city);
              } else {
                console.warn(`Nie znaleziono adresu: ${fullAddress}`);
              }

              if (pendingGeocodes === 0) {
                finishMap();
              }
            });
          }
        });

        if (pendingGeocodes === 0) {
          finishMap();
        }
      },

      error: function (error) {
        console.error("Błąd wczytywania CSV:", error);
        resultsCount.textContent = "Nie udało się wczytać sklepów.";
      }
    });

    searchInput.addEventListener("input", () => {
      filterMarkers(searchInput.value);
    });

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      filterMarkers("");
      searchInput.focus();
    });

    function parseCoordinate(value) {
      if (!value) return NaN;

      return parseFloat(
        String(value)
          .replace(/"/g, "")
          .replace(/;/g, "")
          .replace(",", ".")
          .trim()
      );
    }

    function createMarker(location, title, address, phone, city) {
      const marker = new google.maps.Marker({
        position: location,
        title: title,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: "#0f766e",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 3
        }
      });

      marker.searchText = normalizeText(`${title} ${address} ${city} ${phone || ""}`);

      marker.addListener("click", () => {
        infoWindow.setContent(createInfoWindowContent(title, address, phone));
        infoWindow.open(map, marker);
      });

      markers.push(marker);
    }

    function createInfoWindowContent(title, address, phone) {
      const encodedAddress = encodeURIComponent(address);
      const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodedAddress}`;

      const phoneHtml = phone
        ? `
          <div class="info-row">
            <span class="info-label">Telefon:</span>
            <a class="info-phone" href="tel:${cleanPhoneNumber(phone)}">${escapeHtml(phone)}</a>
          </div>
        `
        : "";

      return `
        <div class="info-window">
          <div class="info-title">${escapeHtml(title)}</div>

          <div class="info-row">
            <span class="info-label">Adres:</span>
            ${escapeHtml(address)}
          </div>

          ${phoneHtml}

          <a class="directions-button" href="${directionsUrl}" target="_blank" rel="noopener">
            Wyznacz trasę
          </a>
        </div>
      `;
    }

    function finishMap() {
      if (mapFinished) {
        return;
      }

      mapFinished = true;

      clusterer = new markerClusterer.MarkerClusterer({
        map: map,
        markers: markers,
        renderer: createClusterRenderer()
      });

      updateResultsCount(markers.length);
      fitMapToMarkers(markers);

      google.maps.event.addListenerOnce(map, "bounds_changed", () => {
        if (map.getZoom() > 12) {
          map.setZoom(12);
        }
      });
    }

    function filterMarkers(query) {
      if (!mapFinished) {
        return;
      }

      const normalizedQuery = normalizeText(query);

      const visibleMarkers = markers.filter((marker) => {
        return !normalizedQuery || marker.searchText.includes(normalizedQuery);
      });

      infoWindow.close();

      clusterer.clearMarkers();
      clusterer.addMarkers(visibleMarkers);

      updateResultsCount(visibleMarkers.length);
      fitMapToMarkers(visibleMarkers);
    }

    function fitMapToMarkers(visibleMarkers) {
      if (visibleMarkers.length === 0) {
        return;
      }

      const bounds = new google.maps.LatLngBounds();

      visibleMarkers.forEach((marker) => {
        bounds.extend(marker.getPosition());
      });

      map.fitBounds(bounds);

      if (visibleMarkers.length === 1) {
        map.setZoom(14);
      }
    }

    function updateResultsCount(count) {
      if (count === 1) {
        resultsCount.textContent = "Znaleziono 1 sklep";
      } else {
        resultsCount.textContent = `Znaleziono ${count} sklepów`;
      }
    }

    function createClusterRenderer() {
      return {
        render: ({ count, position }) => {
          return new google.maps.Marker({
            position,
            label: {
              text: String(count),
              color: "#ffffff",
              fontSize: "13px",
              fontWeight: "700"
            },
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: Math.min(18 + count / 4, 32),
              fillColor: "#134e4a",
              fillOpacity: 0.92,
              strokeColor: "#ffffff",
              strokeWeight: 3
            },
            zIndex: Number(google.maps.Marker.MAX_ZINDEX) + count
          });
        }
      };
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function cleanPhoneNumber(phone) {
      return String(phone).replace(/[^\d+]/g, "");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
